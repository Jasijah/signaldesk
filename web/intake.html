<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Customer request · SignalDesk</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:25px}
    .request-shell{width:min(100%,510px)}
    .request-brand{display:flex;align-items:center;gap:12px;margin-bottom:23px;font-weight:750;font-size:18px}
    .request-card{padding:28px}.request-card h1{font-size:25px;letter-spacing:-.8px;margin:0 0 8px}
    .request-card>p{color:#8390a3;font-size:12px;line-height:1.6}
    .request-card .intake-form{padding:18px 0 0}
    .request-result{padding:20px;background:#eef8f3;border-radius:10px;color:#246b51;font-size:13px;line-height:1.6}
    .request-foot{text-align:center;color:#a5afbd;font-size:10px;margin-top:16px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div class="request-shell">
    <div class="request-brand"><span class="brand-mark" id="requestMark">Y<span></span></span><span id="requestBusiness">Your business</span></div>
    <section class="panel request-card">
      <h1>How can we help?</h1><p id="requestTagline">Tell us what happened and how to reach you.</p>
      <form class="intake-form" id="requestForm">
        <label>Your name<input name="account" minlength="2" maxlength="200" required autocomplete="name"></label>
        <label>Email for a reply<input type="email" name="email" maxlength="254" required autocomplete="email"></label>
        <label>What is this about?<input name="subject" minlength="2" maxlength="200" required></label>
        <label>Type of request<select name="category"><option>Request</option><option>Complaint</option><option>Order issue</option><option>Appointment</option><option>Billing</option><option>Other</option></select></label>
        <label>What happened?<textarea name="issue" minlength="2" maxlength="200" required></textarea></label>
        <label hidden aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
        <button class="button primary" type="submit" id="requestSubmit" disabled>Send request</button>
        <p id="requestError" role="alert" hidden></p>
      </form>
    </section>
    <div class="request-foot" id="requestFoot">Portfolio demo · Use fictional details only</div>
  </div>
  <script>
    let pilot=false;
    Promise.all([fetch('/api/config').then(r=>r.json()),fetch('/api/business').then(r=>r.json())]).then(([config,b])=>{
      pilot=Boolean(config.pilot);
      document.getElementById('requestBusiness').textContent=b.name;
      document.getElementById('requestTagline').textContent=b.tagline||'Tell us how we can help.';
      document.getElementById('requestMark').firstChild.textContent=b.name.slice(0,1).toUpperCase();
      document.getElementById('requestMark').style.background=b.accent;
      document.getElementById('requestSubmit').style.background=b.accent;
      document.title='Customer request · '+b.name;
      document.getElementById('requestFoot').textContent=pilot?'Your request is shared with this business so they can respond. Do not include passwords or payment card details.':'Portfolio demo · Use fictional details only · No real business receives this request';
      if(pilot)document.getElementById('requestSubmit').disabled=false;
    }).catch(()=>{document.getElementById('requestError').textContent='Request page unavailable. Please try again later.';document.getElementById('requestError').hidden=false;});
    document.getElementById('requestForm').addEventListener('submit',async event=>{
      event.preventDefault();if(!pilot)return;
      const form=event.target,button=form.querySelector('button'),error=document.getElementById('requestError');
      button.disabled=true;error.hidden=true;
      try{
        const data=Object.fromEntries(new FormData(form));
        const response=await fetch('/api/public/intake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        const result=await response.json();
        if(!response.ok)throw new Error(result.error||'Could not save request');
        const confirmation=document.createElement('div');confirmation.className='request-result';
        confirmation.textContent='Request received. Your reference is '+result.id+'. Please save it for your records.';
        form.replaceWith(confirmation);
      }catch(exc){button.disabled=false;error.textContent=exc.message;error.hidden=false;}
    });
  </script>
</body>
</html>
