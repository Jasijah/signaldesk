<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Customer request · SignalDesk</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:25px}.request-shell{width:min(100%,510px)}.request-brand{display:flex;align-items:center;gap:12px;margin-bottom:23px;font-weight:750;font-size:18px}.request-card{padding:28px}.request-card h1{font-size:25px;letter-spacing:-.8px;margin:0 0 8px}.request-card>p{color:#8390a3;font-size:12px;line-height:1.6}.request-card .intake-form{padding:18px 0 0}.request-result{padding:20px;background:#eef8f3;border-radius:10px;color:#246b51;font-size:13px;line-height:1.6}.request-foot{text-align:center;color:#a5afbd;font-size:10px;margin-top:16px}</style></head><body><div class="request-shell"><div class="request-brand"><span class="brand-mark" id="requestMark">Y<span></span></span><span id="requestBusiness">Your business</span><small style="color:#9aa5b4;font-size:10px;font-weight:500">/ Customer request</small></div><section class="panel request-card"><h1>How can we help?</h1><p id="requestTagline">Tell us what happened. We’ll organize your request and follow up.</p><form class="intake-form" id="requestForm"><label>Your name<input name="account" minlength="2" maxlength="200" required placeholder="Your name"></label><label>Service<input name="service" minlength="2" maxlength="200" required placeholder="What service was this about?"></label><label>What happened?<textarea name="issue" minlength="2" maxlength="200" required placeholder="Share your question or concern"></textarea></label><button class="button primary" type="submit" id="requestSubmit">Send request</button></form></section><div class="request-foot">Portfolio demo · Use fictional details only · No real business receives this request</div></div><script>fetch('/api/business').then(r=>r.json()).then(b=>{document.getElementById('requestBusiness').textContent=b.name;document.getElementById('requestTagline').textContent=b.tagline||'Tell us how we can help.';document.getElementById('requestMark').firstChild.textContent=b.name.slice(0,1).toUpperCase();document.getElementById('requestMark').style.background=b.accent;document.getElementById('requestSubmit').style.background=b.accent;document.getElementById('requestSubmit').style.borderColor=b.accent;document.title='Customer request · '+b.name;}).catch(()=>{});document.getElementById('requestForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.target;const button=form.querySelector('button');button.disabled=true;try{const data=Object.fromEntries(new FormData(form));data.channel='Private form';data.payment='Not discussed';const response=await fetch('/api/cases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not save request');form.outerHTML='<div class="request-result">Demo request received. Your case reference is <strong>'+result.id+'</strong>. In a real service, the business would follow up through its dedicated inbox.</div>';}catch(error){button.disabled=false;alert(error.message);}});</script></body></html>
